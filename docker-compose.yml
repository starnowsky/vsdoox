services:
  vsdoox:
    build: .
    container_name: vsdoox
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - vsdoox-data:/data
    environment:
      VSDOOX_DB_URL: ${VSDOOX_DB_URL:-sqlite:////data/vsdoox.db}
      VSDOOX_ADMIN_KEY: ${VSDOOX_ADMIN_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      PORT: ${PORT:-5000}
    restart: unless-stopped

volumes:
  vsdoox-data:
